<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rhythm Tiles</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#222b52,#090b17 65%);color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column;padding:18px 14px 14px;gap:12px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900;letter-spacing:1px;color:#8ffcff;text-shadow:0 0 18px #24cddd}.stat{font-size:17px;font-weight:bold}.sub{opacity:.65;font-size:12px;letter-spacing:2px}
#board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;position:relative;overflow:hidden;border:1px solid #4a5c8a;border-radius:18px;padding:7px;background:#0a1024;box-shadow:0 0 30px #1a8dba33}
.lane{position:relative;border-radius:9px;background:linear-gradient(#172344,#10182e);overflow:hidden}.tile{position:absolute;left:4px;right:4px;height:100px;border-radius:8px;background:linear-gradient(135deg,#40f4f0,#4b83ff);box-shadow:0 0 18px #3eeaff88;bottom:0;animation:fall linear forwards}.tile.hit{opacity:.2}@keyframes fall{from{transform:translateY(-120px)}to{transform:translateY(110vh)}}
#hitline{position:absolute;bottom:22%;left:7px;right:7px;height:3px;background:#ff5be7;box-shadow:0 0 12px #ff5be7;pointer-events:none}
.controls{display:flex;gap:8px}.btn{flex:1;border:1px solid #5c76a8;border-radius:14px;padding:15px 8px;background:#192747;color:white;font-size:15px;font-weight:bold}.primary{background:linear-gradient(100deg,#168fbb,#6555d9);border:0}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080d1ddd;z-index:5;border-radius:18px;text-align:center;padding:25px}.panel{max-width:300px}.panel h1{font-size:34px;color:#8ffcff;margin:0 0 8px}.panel p{line-height:1.5;color:#c6d4f4}.big{font-size:19px;padding:17px 35px;border-radius:16px;border:0;background:linear-gradient(100deg,#13a9c4,#7159e8);color:white;font-weight:bold}
</style></head><body><div id="app"><div class="top"><div><div class="logo">RHYTHM TILES</div><div class="sub">TAP TO THE BEAT</div></div><div class="stat">★ <span id="score">0</span><br><small>BEST: <span id="best">0</span></small></div></div>
<div id="board"><div id="hitline"></div><div id="overlay"><div class="panel"><h1>Rhythm Tiles</h1><p>Нажимай на голубые плитки, пока они не пересекли линию. Не пропускай ни одной!</p><button class="big" id="start">ИГРАТЬ</button></div></div></div>
<div class="controls"><button class="btn" id="pause">Ⅱ ПАУЗА</button><button class="btn primary" id="restart">↻ ЗАНОВО</button></div></div>
<script>
const board=document.getElementById('board'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let score=0,best=+(localStorage.bestRhythm||0),running=false,paused=false,timer=null,tiles=[],speed=2.5;bestEl.textContent=best;
function clear(){tiles.forEach(t=>t.el.remove());tiles=[];clearInterval(timer)}
function end(){running=false;clear();overlay.style.display='flex';overlay.innerHTML='<div class="panel"><h1>Игра окончена</h1><p>Счёт: '+score+'<br>Рекорд: '+best+'</p><button class="big" onclick="start()">ЕЩЁ РАЗ</button></div>'}
function spawn(){if(!running||paused)return;let lane=Math.floor(Math.random()*4),el=document.createElement('div');el.className='tile';el.style.animationDuration=speed+'s';board.children[lane].appendChild(el);let item={el,lane,hit:false, born:Date.now()};tiles.push(item);el.addEventListener('animationend',()=>{if(!item.hit&&running)end()});}
function start(){clear();score=0;speed=2.5;scoreEl.textContent=0;running=true;paused=false;overlay.style.display='none';timer=setInterval(spawn,850);spawn()}
function tap(lane){if(!running||paused)return;let candidates=tiles.filter(t=>t.lane===lane&&!t.hit);if(!candidates.length){end();return}let t=candidates[candidates.length-1];t.hit=true;t.el.remove();score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.bestRhythm=best}if(score%8===0)speed=Math.max(1.25,speed-.12)}
for(let i=0;i<4;i++){let lane=document.createElement('div');lane.className='lane';lane.addEventListener('pointerdown',()=>tap(i));board.insertBefore(lane,document.getElementById('hitline'))}
document.getElementById('start').onclick=start;document.getElementById('restart').onclick=start;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ ПРОДОЛЖИТЬ':'Ⅱ ПАУЗА';if(paused){clearInterval(timer);tiles.forEach(t=>t.el.style.animationPlayState='paused')}else{timer=setInterval(spawn,850);tiles.forEach(t=>t.el.style.animationPlayState='running')}};
</script></body></html>
